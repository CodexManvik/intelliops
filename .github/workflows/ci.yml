name: CI
on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default; jobs that need more widen it for themselves.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: intelliops
          POSTGRES_DB: intelliops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The pinned embedding model, so its parity test runs instead of skipping.
      - name: Fetch the embedding model
        run: |
          mkdir -p models/minilm && cd models/minilm
          base=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41
          for f in config.json tokenizer.json model.safetensors; do curl -fsSLO "$base/$f"; done
          sha256sum -c <<'SUMS'
          953f9c0d463486b10a6871cc2fd59f223b2c70184f49815e7efbcab5d8908b41  config.json
          be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037  tokenizer.json
          53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db  model.safetensors
          SUMS
      - run: cargo test --locked
        env:
          INTELLIOPS_TEST_DATABASE_URL: postgresql://postgres:intelliops@127.0.0.1:5432/intelliops_test

  # Real remediation against a real API server, in a throwaway cluster.
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-kube-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-kube-${{ runner.os }}-
      - uses: helm/kind-action@v1
      - run: cargo test --locked -p intelliops-action --test live_cluster -- --nocapture
        env:
          INTELLIOPS_KUBE_TEST: "1"

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Render the chart in every posture we ship, so a template error is caught in
  # review rather than at `helm install`.
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHART: deploy/k8s/platform
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint "$CHART"
      - run: helm lint "$CHART" -f "$CHART/values-live.yaml"
      - name: Render safe, live, sandbox and existing-secret postures
        run: |
          helm template t "$CHART" > /dev/null
          helm template t "$CHART" -f "$CHART/values-live.yaml" --set-string llm.apiKey=x > /dev/null
          helm template t "$CHART" --set rbac.create=true --set rbac.sandbox=true > /dev/null
          helm template t "$CHART" --set postgres.existingSecret=my-pg > /dev/null

  # --- Dependency audits -----------------------------------------------------
  # Blocking: a known vulnerability in a locked dependency fails the PR.
  audit-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  audit-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [frontend, meridian-ui]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Audits the lockfile directly. --omit=dev scopes it to what ships to the
      # browser.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.dir }}

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [rust, frontend-build]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker compose -f deploy/docker-compose.yml build
      - run: docker compose -f deploy/docker-compose.yml up -d --wait --wait-timeout 300
      - run: bash scripts/smoke.sh
      # Logs + metrics UI: Loki ready, Grafana up with all three datasources
      # healthy, and Alloy actually shipping container logs into Loki.
      - name: Observability stack
        run: |
          for url in http://localhost:3100/ready http://localhost:3000/api/health; do
            for attempt in $(seq 1 30); do
              curl -sf "$url" >/dev/null && { echo " ok $url"; break; }
              [ "$attempt" -eq 30 ] && { echo "$url never answered 200"; exit 1; }
              sleep 3
            done
          done
          for uid in prometheus loki intelliops-postgres; do
            health=$(curl -sf -u admin:admin "http://localhost:3000/api/datasources/uid/$uid/health")
            grep -q '"status":"OK"' <<<"$health" || { echo "grafana datasource $uid unhealthy"; exit 1; }
            echo " ok grafana datasource $uid"
          done
          for attempt in $(seq 1 30); do
            labels=$(curl -sf "http://localhost:3100/loki/api/v1/label/service/values" || true)
            grep -q '"governance"' <<<"$labels" && { echo " ok loki is receiving service logs"; break; }
            [ "$attempt" -eq 30 ] && { echo "no service logs reached loki"; exit 1; }
            sleep 3
          done
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down

  # Immutable, CI-verified images, built natively on each architecture so they
  # run on a free ARM server as well as x86. Deploy with:
  #   --set image.prefix=ghcr.io/<owner>/intelliops --set image.tag=<git-sha>
  #   --set console.repository=ghcr.io/<owner>/intelliops-console
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [compose-smoke, kubernetes, helm]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push every image for this architecture
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          arch=$(dpkg --print-architecture)
          push() { # name, dockerfile, then extra build arguments
            local image="ghcr.io/$owner/$1:${GITHUB_SHA}-$arch" file="$2"
            shift 2
            docker build -f "$file" "$@" -t "$image" .
            docker push "$image"
          }
          for s in ingestion correlation action governance feedback read; do
            push "intelliops-$s" deploy/Dockerfile --target service --build-arg "SERVICE=$s"
          done
          push intelliops-rca deploy/Dockerfile --target rca --build-arg SERVICE=rca
          push intelliops-sim deploy/Dockerfile --target sim --build-arg SERVICE=sim
          push intelliops-console deploy/Dockerfile.frontend

  # One tag per commit that resolves to the right architecture.
  manifests:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          for s in ingestion correlation rca action governance feedback read sim console; do
            image="ghcr.io/$owner/intelliops-$s"
            docker buildx imagetools create -t "$image:$GITHUB_SHA" \
              "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
          done
