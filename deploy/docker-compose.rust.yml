# Run the services ported to Rust in place of their Python versions:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.rust.yml up --build
#
# Drop this file (or one block of it) to go back to Python.

x-rust-healthcheck: &rust-healthcheck
  test: ["CMD", "/usr/local/bin/service", "healthcheck"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  ingestion:
    image: intelliops-ingestion-rs:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        SERVICE: ingestion
      target: service
    healthcheck: *rust-healthcheck

  correlation:
    image: intelliops-correlation-rs:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        SERVICE: correlation
      target: service
    healthcheck: *rust-healthcheck

  feedback:
    image: intelliops-feedback-rs:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        SERVICE: feedback
      target: service
    healthcheck: *rust-healthcheck

  read:
    image: intelliops-read-rs:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        SERVICE: read
      target: service
    healthcheck: *rust-healthcheck

  governance:
    image: intelliops-governance-rs:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        SERVICE: governance
      target: service
    healthcheck: *rust-healthcheck

  rca:
    image: intelliops-rca-rs:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        SERVICE: rca
      target: rca
    healthcheck: *rust-healthcheck
