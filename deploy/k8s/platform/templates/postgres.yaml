{{/*
postgres.yaml
Renders a Deployment and a Service for the Postgres instance used as the data store.
Image is configured via values.postgres.image (default postgres:16).
Credentials and database name are taken from values.postgres.user/password/db.
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    {{- include "intelliops.labels" . | nindent 4 }}
    {{- include "intelliops.selectorLabels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "intelliops.selectorLabels" (dict "root" . "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "intelliops.selectorLabels" (dict "root" . "name" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "intelliops.labels" . | nindent 4 }}
    {{- include "intelliops.selectorLabels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "intelliops.selectorLabels" (dict "root" . "name" "postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
