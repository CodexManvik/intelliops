{{/*
migrate-job.yaml
Runs "alembic upgrade head" against Postgres. This is a REGULAR resource (not a
Helm pre-install hook): the migration needs both the intelliops-env ConfigMap
AND a running Postgres, neither of which exists during the pre-install hook phase
(they are regular chart resources). As a normal resource it is applied alongside
them; an initContainer blocks until Postgres accepts connections, then alembic
runs. Application pods stay out of rotation via their readiness probes until the
schema is present, so ordering is safe without a hook.

`backoffLimit` retries the whole Job if it fails (e.g. Postgres still starting);
the initContainer wait makes that rare. helm.sh/hook-succeeded is intentionally
NOT used — a hook cannot see the DB.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "intelliops.fullname" . }}-migrate
  labels:
    {{- include "intelliops.labels" . | nindent 4 }}
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "intelliops.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Block until Postgres accepts TCP — the DB is a regular Deployment that
        # may still be starting when this Job is created.
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image }}"
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Release.Name }}-postgres -p 5432 -U {{ .Values.postgres.user }}; do
                echo "waiting for postgres…"; sleep 2;
              done
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: intelliops-env
