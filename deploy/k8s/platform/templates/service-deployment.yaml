{{/*
service-deployment.yaml
Ranges over .Values.services and renders one Deployment + one Service per entry.

Each Deployment:
  - selects the base or `full` image per service (service.image: full → rca, action)
  - sets SERVICE_MODULE from service.module and PORT from service.port as env vars
  - mounts intelliops-env ConfigMap as envFrom
  - action: uses the intelliops-action ServiceAccount when rbac.create (real remediation)
  - rca: gets the LLM API key via secretKeyRef when a key/secret is configured
  - includes liveness (/health) + readiness (/ready) probes
*/}}
{{- range .Values.services }}
{{- $img := $.Values.image.repository }}
{{- $tag := $.Values.image.tag }}
{{- if eq (.image | default "base") "full" }}
{{-   $img = ($.Values.image.fullRepository | default "") }}
{{-   if eq $img "" }}{{ $img = $.Values.image.repository }}{{ end }}
{{-   $tag = $.Values.image.fullTag }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "intelliops.labels" $ | nindent 4 }}
    {{- include "intelliops.selectorLabels" (dict "root" $ "name" .name) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "intelliops.selectorLabels" (dict "root" $ "name" .name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "intelliops.selectorLabels" (dict "root" $ "name" .name) | nindent 8 }}
    spec:
      {{- if and $.Values.rbac.create (eq .name "action") }}
      serviceAccountName: intelliops-action
      {{- end }}
      containers:
        - name: {{ .name }}
          image: "{{ $img }}:{{ $tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: intelliops-env
          env:
            - name: SERVICE_MODULE
              value: {{ .module | quote }}
            - name: PORT
              value: {{ .port | quote }}
            {{- if and (eq .name "rca") (or $.Values.llm.apiKey $.Values.llm.apiKeySecretName) }}
            {{- $secretName := $.Values.llm.apiKeySecretName | default (printf "%s-llm" $.Release.Name) }}
            - name: INTELLIOPS_LLM_EXPLANATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: api-key
            {{- end }}
          ports:
            - containerPort: {{ .port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "intelliops.labels" $ | nindent 4 }}
    {{- include "intelliops.selectorLabels" (dict "root" $ "name" .name) | nindent 4 }}
spec:
  {{- if and (eq .name "read") $.Values.readNodePort }}
  type: NodePort
  {{- end }}
  selector:
    {{- include "intelliops.selectorLabels" (dict "root" $ "name" .name) | nindent 4 }}
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
      {{- if and (eq .name "read") $.Values.readNodePort }}
      nodePort: {{ $.Values.readNodePort }}
      {{- end }}
{{- end }}
