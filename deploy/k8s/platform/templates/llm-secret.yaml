{{/*
llm-secret.yaml
The LLM API key as a k8s Secret — rendered ONLY when a key is supplied inline
(helm install ... --set-string llm.apiKey=...). The key is NEVER committed to
git or placed in the ConfigMap. If you pre-create your own Secret instead, leave
llm.apiKey empty and set llm.apiKeySecretName to its name (then this renders
nothing and the rca pod references your Secret directly).
*/}}
{{- if .Values.llm.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-llm
  labels:
    {{- include "intelliops.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.llm.apiKey | quote }}
{{- end }}
