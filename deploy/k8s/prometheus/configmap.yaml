# deploy/k8s/prometheus/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: intelliops-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: demo-app
        static_configs:
          - targets: ["demo-app.intelliops-demo:8080"]
            labels:
              service: demo-app
