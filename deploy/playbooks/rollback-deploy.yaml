id: rollback-deploy
name: Roll back recent deployment
match_rule: "recent deploy preceded the incident"
steps:
  - action: rollback_deploy
    note: "kubectl rollout undo deployment/${service}"
  - action: wait
    note: "verify health after rollback"
hitl_mode: hitl
reversible: true
rollback_steps:
  - action: rollback_deploy
    note: "kubectl rollout undo deployment/${service} --to-revision=previous"
symptoms: "a regression immediately after a recent deployment or release, a bad new version misbehaving — revert to the prior revision"
