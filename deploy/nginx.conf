# nginx for the IntelliOps console: serves the built SPA and reverse-proxies each
# backend the app calls (read/governance/correlation/rca) under a same-origin
# /api/* prefix. Same-origin means no CORS and simple SSE. The frontend is built
# with VITE_*_URL pointing at these prefixes (see deploy/Dockerfile.frontend).
#
# In-cluster the backends are reachable by their Service DNS on port 8000.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # read-service — includes /stream (Server-Sent Events). SSE REQUIRES
    # proxy_buffering off + HTTP/1.1 + a cleared Connection header, or events
    # buffer and the live console stalls.
    location /api/read/ {
        proxy_pass http://read:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # governance-service — includes /agent-runs/{id}/stream (Server-Sent Events
    # for the live agent-activity trace). SSE REQUIRES proxy_buffering off +
    # HTTP/1.1 + a cleared Connection header, or events buffer and the live
    # console stalls (same as /api/read/).
    location /api/gov/ {
        proxy_pass http://governance:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/corr/ {
        proxy_pass http://correlation:8000/;
        proxy_http_version 1.1;
    }

    location /api/rca/ {
        proxy_pass http://rca:8000/;
        proxy_http_version 1.1;
    }
}
