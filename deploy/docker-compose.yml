name: intelliops

# The binary answers its own healthcheck (GET /ready): the images have no shell.
x-healthcheck: &healthcheck
  test: ["CMD", "/usr/local/bin/service", "healthcheck"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

x-env: &env
  INTELLIOPS_REDIS_URL: redis://redis:6379
  INTELLIOPS_LOG_FORMAT: json

# Services with durable state. They create any missing tables when they start.
x-store-env: &store-env
  INTELLIOPS_REDIS_URL: redis://redis:6379
  INTELLIOPS_LOG_FORMAT: json
  INTELLIOPS_STORE_BACKEND: postgres
  INTELLIOPS_DATABASE_URL: postgresql://intelliops:intelliops@postgres:5432/intelliops

x-after-redis: &after-redis
  redis:
    condition: service_healthy

x-after-stores: &after-stores
  redis:
    condition: service_healthy
  postgres:
    condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intelliops
      POSTGRES_PASSWORD: intelliops
      POSTGRES_DB: intelliops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliops -d intelliops"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingestion:
    image: intelliops-ingestion:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: service
      args: { SERVICE: ingestion }
    environment:
      <<: *env
      INTELLIOPS_TELEMETRY_MODE: prometheus
      INTELLIOPS_PROMETHEUS_URL: http://prometheus:9090
      INTELLIOPS_PROMETHEUS_QUERY: '{__name__=~"cpu_usage|meridian_error_rate|request_rate|latency_p50_ms|latency_p99_ms|memory_usage_mb|saturation|queue_depth|db_pool_in_use|db_pool_max|disk_usage_percent|service_up|tls_handshake_failures"}'
    ports:
      - "8001:8000"
    healthcheck: *healthcheck
    depends_on: *after-redis

  correlation:
    image: intelliops-correlation:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: service
      args: { SERVICE: correlation }
    environment:
      <<: *store-env
      # Demo-friendly detection: a short warm-up and window and a lower
      # threshold, so an injected spike surfaces within a minute or two.
      INTELLIOPS_CORRELATION_WARMUP_SAMPLES: "8"
      INTELLIOPS_CORRELATION_WINDOW_SECONDS: "15"
      INTELLIOPS_CORRELATION_Z_THRESHOLD: "2.0"
    ports:
      - "8002:8000"
    healthcheck: *healthcheck
    depends_on: *after-stores

  rca:
    image: intelliops-rca:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: rca
      args: { SERVICE: rca }
    environment:
      <<: *store-env
      # "embedding" ranks runbooks by how well their symptoms match; "off" is
      # keyword rules only.
      INTELLIOPS_RUNBOOK_SELECTOR_MODE: "${INTELLIOPS_RUNBOOK_SELECTOR_MODE:-embedding}"
      # Optional LLM explanations: any OpenAI-compatible endpoint. Empty means
      # the offline template. Values come from deploy/.env (gitignored).
      INTELLIOPS_LLM_EXPLANATION_ENDPOINT: "${INTELLIOPS_LLM_ENDPOINT:-}"
      INTELLIOPS_LLM_EXPLANATION_MODEL: "${INTELLIOPS_LLM_MODEL:-gpt-4o-mini}"
      INTELLIOPS_LLM_EXPLANATION_API_KEY: "${INTELLIOPS_LLM_API_KEY:-}"
    ports:
      - "8003:8000"
    volumes:
      # Shared with the Meridian gateway, which writes deploy markers.
      - rca-context:/app/data/rca_context
    healthcheck: *healthcheck
    depends_on: *after-stores

  action:
    image: intelliops-action:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: service
      args: { SERVICE: action }
    environment:
      <<: *store-env
      INTELLIOPS_GOVERNANCE_URL: http://governance:8000
    ports:
      - "8004:8000"
    healthcheck: *healthcheck
    depends_on: *after-stores

  governance:
    image: intelliops-governance:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: service
      args: { SERVICE: governance }
    environment:
      <<: *store-env
      # The AI runbook author. Off unless set to "openai".
      INTELLIOPS_RUNBOOK_AUTHOR_MODE: "${INTELLIOPS_RUNBOOK_AUTHOR_MODE:-off}"
      INTELLIOPS_LLM_RUNBOOK_ENDPOINT: "${INTELLIOPS_LLM_ENDPOINT:-}"
      INTELLIOPS_LLM_RUNBOOK_MODEL: "${INTELLIOPS_LLM_MODEL:-gpt-4o-mini}"
      INTELLIOPS_LLM_RUNBOOK_API_KEY: "${INTELLIOPS_LLM_API_KEY:-}"
      INTELLIOPS_LLM_RUNBOOK_TIMEOUT_SECONDS: "${INTELLIOPS_LLM_TIMEOUT_SECONDS:-30}"
    ports:
      - "8005:8000"
    healthcheck: *healthcheck
    depends_on: *after-stores

  feedback:
    image: intelliops-feedback:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: service
      args: { SERVICE: feedback }
    environment:
      <<: *store-env
    ports:
      - "8006:8000"
    healthcheck: *healthcheck
    depends_on: *after-stores

  read:
    image: intelliops-read:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: service
      args: { SERVICE: read }
    environment:
      <<: *env
      INTELLIOPS_RCA_URL: http://rca:8000
      INTELLIOPS_GOVERNANCE_URL: http://governance:8000
      INTELLIOPS_PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "8007:8000"
    healthcheck: *healthcheck
    depends_on: *after-redis

  # ---- The workloads being watched ---------------------------------------
  demo-app:
    image: intelliops-sim:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: sim
      args: { SERVICE: sim }
    environment:
      INTELLIOPS_SIM: demo-app
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck: *healthcheck

  meridian-gateway:
    image: intelliops-sim:latest
    environment:
      INTELLIOPS_SIM: meridian-gateway
      INTELLIOPS_RCA_CONTEXT_PATH: /app/data/rca_context
      INTELLIOPS_PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "8008:8000"
    volumes:
      - rca-context:/app/data/rca_context
    healthcheck: *healthcheck

  meridian-validation:
    image: intelliops-sim:latest
    environment:
      INTELLIOPS_SIM: meridian-validation
    ports:
      - "8011:8000"
    healthcheck: *healthcheck

  meridian-aggregation:
    image: intelliops-sim:latest
    environment:
      INTELLIOPS_SIM: meridian-aggregation
    ports:
      - "8012:8000"
    healthcheck: *healthcheck

  meridian-reporting:
    image: intelliops-sim:latest
    environment:
      INTELLIOPS_SIM: meridian-reporting
    ports:
      - "8013:8000"
    healthcheck: *healthcheck

  prometheus:
    image: prom/prometheus:v2.54.1 # pinned, matches the Helm chart
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      demo-app:
        condition: service_healthy

  # ---- Logs & metrics UI: Grafana at http://localhost:3000 ----------------
  # Loki stores every container's logs (shipped by Alloy through the Docker
  # socket); Grafana puts them next to the Prometheus metrics and the Postgres
  # audit trail. Config lives in deploy/k8s/platform/files/observability/ so the
  # Helm chart ships the same.
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./k8s/platform/files/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.4.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy-docker.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to the Docker API, to discover and tail containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345" # Alloy's own UI
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      # Anyone who can reach localhost:3000 can VIEW. Editing needs the admin
      # login. Turn anonymous off for anything shared.
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/intelliops-dashboard.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      INTELLIOPS_PG_USER: intelliops
      INTELLIOPS_PG_PASSWORD: intelliops
      INTELLIOPS_PG_DB: intelliops
    volumes:
      - ./k8s/platform/files/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/intelliops.yaml:ro
      - ./k8s/platform/files/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/intelliops.yaml:ro
      - ./k8s/platform/files/observability/intelliops-dashboard.json:/var/lib/grafana/dashboards/intelliops-dashboard.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus
      - postgres

volumes:
  postgres-data:
  loki-data:
  # Shared between rca and the Meridian gateway.
  rca-context:
