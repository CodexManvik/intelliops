name: intelliops

x-service: &service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment:
    INTELLIOPS_REDIS_URL: redis://redis:6379
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intelliops
      POSTGRES_PASSWORD: intelliops
      POSTGRES_DB: intelliops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliops -d intelliops"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: applies Alembic migrations, then exits. The four store-using
  # services wait for it (service_completed_successfully) before starting.
  migrate:
    <<: *service
    command: alembic upgrade head
    environment:
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      SERVICE_MODULE: services.ingestion.app:app
      PORT: "8000"
      INTELLIOPS_TELEMETRY_MODE: prometheus
      INTELLIOPS_PROMETHEUS_URL: http://prometheus:9090
      INTELLIOPS_PROMETHEUS_QUERY: cpu_usage
    ports:
      - "8001:8000"

  correlation:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      SERVICE_MODULE: services.correlation.app:app
      PORT: "8000"
      # Demo-friendly detection: shorter warm-up/window and a lower z-threshold
      # so the injected 18->92 cpu spike reliably clears detection and surfaces
      # within a minute or two (production would run higher/stricter).
      INTELLIOPS_CORRELATION_WARMUP_SAMPLES: "8"
      INTELLIOPS_CORRELATION_WINDOW_SECONDS: "15"
      INTELLIOPS_CORRELATION_Z_THRESHOLD: "2.0"
    ports:
      - "8002:8000"

  rca:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      SERVICE_MODULE: services.rca.app:app
      PORT: "8000"
      INTELLIOPS_STORE_BACKEND: postgres
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
    ports:
      - "8003:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  action:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      SERVICE_MODULE: services.action.app:app
      PORT: "8000"
      INTELLIOPS_GOVERNANCE_MODE: http
      INTELLIOPS_GOVERNANCE_URL: http://governance:8000
      INTELLIOPS_STORE_BACKEND: postgres
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
    ports:
      - "8004:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  governance:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      SERVICE_MODULE: services.governance.app:app
      PORT: "8000"
      INTELLIOPS_STORE_BACKEND: postgres
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
    ports:
      - "8005:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  feedback:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      SERVICE_MODULE: services.feedback.app:app
      PORT: "8000"
      INTELLIOPS_STORE_BACKEND: postgres
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
    ports:
      - "8006:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  demo-app:
    <<: *service
    environment:
      SERVICE_MODULE: services.demo_app.app:app
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      demo-app:
        condition: service_healthy

  read:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      SERVICE_MODULE: services.read.app:app
      PORT: "8000"
    ports:
      - "8007:8000"

  kafka:
    image: bitnami/kafka:3.7
    profiles:
      - kafka
    environment:
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
