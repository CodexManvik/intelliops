id: rollback-deploy
name: Rollback Deployment
match_rule: "hypothesis == 'recent-deploy'"
steps:
  - action: rollback_deploy
    note: "kubectl rollout undo deploy/{service}"
hitl_mode: hitl
reversible: true
rollback_steps:
  - action: rollback_deploy
    note: "kubectl rollout undo deploy/{service} --to-revision={prev}"
symptoms: "a regression immediately after a recent deployment or release, a bad new version misbehaving — revert to the prior revision"
