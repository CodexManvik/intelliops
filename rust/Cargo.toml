[workspace]
resolver = "3"
members = ["crates/*"]
# The rust-anything unit crates are verification harnesses with their own builds.
exclude = ["units"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
serde_yaml_ng = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "derive"] }
indexmap = "2"
axum = "0.8"
prometheus-client = "0.26"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "streams"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# A panicking background task takes the process down, so it is restarted.
panic = "abort"
lto = true
codegen-units = 1
strip = true
