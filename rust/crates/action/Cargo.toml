[package]
name = "intelliops-action"
version = "0.1.0"
description = "Gated, reversible remediation against Kubernetes"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
intelliops-bus = { path = "../bus" }
intelliops-contracts = { path = "../contracts" }
intelliops-detect = { path = "../detect" }
intelliops-service = { path = "../service" }
intelliops-store = { path = "../store" }
k8s-openapi = { version = "0.29", features = ["v1_33"] }
kube = { version = "5", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
axum.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
http = "1"
tower-test = "0.4"

[lints]
workspace = true
